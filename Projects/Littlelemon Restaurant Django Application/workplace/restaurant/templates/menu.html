{% extends 'base.html' %}
{% load static %}

{% block content %}
<h1>Menu</h1>

<!--Begin col-->
<div class="column">
    <!-- Step 14: Create for loop -->
  
   {% for item in menu %}
   <p>
      <a href="{% url 'menu_item' pk=item.pk %}">
         {{ item.name }}  <!-- Use the correct field name -->
      </a>
      <span class="menu-price">${{ item.price }}.00</span>
   </p>
   {% endfor %}


    <!-- Step 14: End loop -->
</div>
<!--End col-->

{% endblock %}
